plugins { id 'com.android.application' }
android {
    namespace 'com.intentintegrity.app'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig { applicationId 'com.intentintegrity.app'; minSdk 26; targetSdk 36; versionCode 2; versionName '0.2.0' }
    buildFeatures { buildConfig true }
    flavorDimensions += 'protection'
    productFlavors {
        core { dimension 'protection'; applicationIdSuffix '.core'; buildConfigField 'boolean', 'GUARD_ENABLED', 'false'; resValue 'string', 'app_name', 'Intent Integrity Core' }
        guard { dimension 'protection'; applicationIdSuffix '.guard'; buildConfigField 'boolean', 'GUARD_ENABLED', 'true'; resValue 'string', 'app_name', 'Intent Integrity Guard' }
    }
    buildTypes {
        debug { applicationIdSuffix '.dev' }
        release { minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
