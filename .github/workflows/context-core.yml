name: Verify private context and capture tooling
on:
  push:
    branches: [main, 'work/**']
    paths: ['tools/**', 'tests/test_*.py', '.github/workflows/context-core.yml']
  pull_request:
    paths: ['tools/**', 'tests/test_*.py', '.github/workflows/context-core.yml']
permissions:
  contents: read
jobs:
  context:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
