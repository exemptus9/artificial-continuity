name: Validate sovereign archive slice
on:
  push:
    branches: ['work/sovereign-memory-v019']
    paths: ['.github/workflows/sovereign-source-build.yml']
permissions:
  contents: write
concurrency:
  group: sovereign-archive-execution
  cancel-in-progress: false
jobs:
  source-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch source-only delivery package
        env:
          SOURCE_PACKAGE: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-ac90-81f5-8e31-c5825a923d54/raw?se=2026-10-04T03%3A08%3A28Z&sp=r&sv=2026-02-06&sr=b&scid=e0c2d922-6713-50dd-8ca9-6f00e1669f1c&skoid=add8ee7d-5fc7-451e-b06e-a82b2276cf62&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-03T17%3A29%3A25Z&ske=2026-10-04T17%3A29%3A25Z&sks=b&skv=2026-02-06&sig=oEjvz10mpSjQ5yxk2q6kDms0OHPvfCLQ4Al4uVltP2k%3D'
        run: |
          echo "::add-mask::$SOURCE_PACKAGE"
          curl --fail --silent --show-error --location "$SOURCE_PACKAGE" -o /tmp/continuity-source.tar.gz
          echo '666f4192b4b73cf35e413efb4eb953978908b127179e2ac5254893992661e2be  /tmp/continuity-source.tar.gz' | sha256sum -c -
      - name: Preserve branch lineage and apply bounded source patch
        run: |
          test "$GITHUB_REF" = 'refs/heads/work/sovereign-memory-v019'
          git config user.name 'Continuity source integration'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          test "$(git rev-parse origin/main)" = '1e1430d37e7283b3838e606829f746dd74e1f551'
          git merge --no-commit --no-ff origin/main || true
          python3 - <<'PY'
          import tarfile,pathlib
          allow={'site/archive.js','site/operations-core.js','site/archive-core.js','site/service-worker.js','site/archive.css','site/workspace.js','site/family-recovery.js','site/index.html','tests/archive.test.cjs','tests/archive-browser.cjs','tests/operations.test.cjs','tests/platform.test.cjs','docs/V0_19_RELEASE.md','.github/workflows/pages.yml','site/proof-of-progress/index.html'}
          with tarfile.open('/tmp/continuity-source.tar.gz') as t:
              members=t.getmembers()
              assert {m.name for m in members} == allow
              assert all(m.isfile() and m.size < 200000 for m in members)
              for m in members:
                  if m.name.startswith('.github/'):
                      continue
                  p=pathlib.Path(m.name);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(t.extractfile(m).read())
          PY
          git add site/archive.js site/archive-core.js site/archive.css site/operations-core.js site/service-worker.js site/workspace.js site/family-recovery.js site/index.html tests/archive.test.cjs tests/archive-browser.cjs tests/operations.test.cjs tests/platform.test.cjs docs/V0_19_RELEASE.md site/proof-of-progress/index.html
          test -z "$(git diff --name-only --diff-filter=U)"
          test -z "$(git diff --cached --name-only -- .github/workflows/)"
          git commit -m 'Integrate source-preserving private archive and publication review v0.19'
          git push origin HEAD:work/sovereign-memory-v019
          mkdir -p test-artifacts
          git rev-parse HEAD > test-artifacts/tested-commit.txt
          sha256sum site/archive-core.js site/archive.js site/proof-of-progress/index.html > test-artifacts/source-sha256.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and data regression tests
        run: |
          for f in site/*.js; do node --check "$f"; done
          node --test tests/*.test.cjs > data-tests.log 2>&1 || { tail -n 150 data-tests.log; exit 1; }
          tail -n 12 data-tests.log
      - name: Install pinned browser tooling
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium > browser-install.log 2>&1
      - name: Test the archive vertical slice first
        run: |
          set -o pipefail
          node tests/archive-browser.cjs 2>&1 | tee archive-browser.log
      - name: Existing browser regression suite
        run: |
          set -o pipefail
          for name in browser operations-browser portability-browser handoff-browser platform-browser exchange-browser workflow-browser review-layout-browser family-browser family-recovery-browser; do
            node "tests/$name.cjs" 2>&1 | tee "$name.log"
          done
      - name: Preserve exact source under test
        if: always()
        run: git archive --format=tar.gz HEAD > source-under-test.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sovereign-archive-evidence
          path: |
            test-artifacts/
            *.log
            source-under-test.tar.gz
          retention-days: 14
          if-no-files-found: error
