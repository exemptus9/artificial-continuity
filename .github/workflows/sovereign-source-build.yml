name: Validate sovereign archive slice
on:
  push:
    branches: ['work/sovereign-memory-v019']
    paths: ['.github/workflows/sovereign-source-build.yml']
permissions:
  contents: write
concurrency:
  group: sovereign-archive-execution
  cancel-in-progress: false
jobs:
  source-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch source-only hardening package
        env:
          SOURCE_PACKAGE: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-a44c-81f5-aa4c-e4a2ac070f6a/raw?se=2026-10-04T03%3A19%3A13Z&sp=r&sv=2026-02-06&sr=b&scid=ff252318-3074-571a-9693-c50f5081236f&skoid=add8ee7d-5fc7-451e-b06e-a82b2276cf62&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-03T16%3A31%3A01Z&ske=2026-10-04T16%3A31%3A01Z&sks=b&skv=2026-02-06&sig=/XX15Q74Rcd9B7jZd/0nh%2BF91rebwutzPj0PNw71tQE%3D'
        run: |
          echo "::add-mask::$SOURCE_PACKAGE"
          curl --fail --silent --show-error --location "$SOURCE_PACKAGE" -o /tmp/hardening.tar.gz
          echo '5338aad27cab474d5f690998c9db81eba779317751ffdca1588eb6e62970268e  /tmp/hardening.tar.gz' | sha256sum -c -
      - name: Apply bounded reviewed source patch on work branch only
        run: |
          test "$GITHUB_REF" = 'refs/heads/work/sovereign-memory-v019'
          git merge-base --is-ancestor e6d0f35a7f46cb0dee312cf779e5803e1d3ce8d8 HEAD
          python3 - <<'PY'
          import tarfile,pathlib,hashlib
          before={'site/archive-core.js':'b9b91a6e6f66f69d60008dfd9125188c576392977de0dff2be230676864734ca','site/workspace.js':'f4f60652ded7f2b6b597f2736eac0ce9981a311aea5717c5700c1048adb58775','tests/archive.test.cjs':'e33f7cfc4e7357f245ede32e16f819f725d0db71d344db515051dbdb01efaf58','tests/archive-browser.cjs':'381a614149f0615208956a6a7609e427e53fa0b0d977bc91c349b57e88c8724f'}
          for name,digest in before.items():assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==digest,name
          with tarfile.open('/tmp/hardening.tar.gz') as t:
              members=t.getmembers();assert {m.name for m in members}==set(before)
              assert all(m.isfile() and m.size<200000 for m in members)
              for m in members:pathlib.Path(m.name).write_bytes(t.extractfile(m).read())
          PY
          git config user.name 'Continuity source integration'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/archive-core.js site/workspace.js tests/archive.test.cjs tests/archive-browser.cjs
          git commit -m 'Preserve provider identities, union branch coverage and prevent source-form hydration races'
          git push origin HEAD:work/sovereign-memory-v019
          mkdir -p test-artifacts
          git rev-parse HEAD > test-artifacts/tested-commit.txt
          sha256sum site/archive-core.js site/archive.js site/workspace.js site/proof-of-progress/index.html > test-artifacts/source-sha256.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and data regression tests
        run: |
          for f in site/*.js; do node --check "$f"; done
          node --test tests/*.test.cjs > data-tests.log 2>&1 || { tail -n 150 data-tests.log; exit 1; }
          tail -n 12 data-tests.log
          python3 -m unittest discover -s tests -p 'test_context_store.py' -v > context-tests.log 2>&1
      - name: Install pinned browser tooling
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium > browser-install.log 2>&1
      - name: Test the archive vertical slice first
        run: |
          set -o pipefail
          node tests/archive-browser.cjs 2>&1 | tee archive-browser.log
      - name: Existing browser regression suite
        run: |
          set -o pipefail
          for name in browser operations-browser portability-browser handoff-browser platform-browser exchange-browser workflow-browser review-layout-browser family-browser family-recovery-browser; do
            node "tests/$name.cjs" 2>&1 | tee "$name.log"
          done
      - name: Preserve exact source under test
        if: always()
        run: git archive --format=tar.gz HEAD > source-under-test.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sovereign-archive-evidence
          path: |
            test-artifacts/
            *.log
            source-under-test.tar.gz
          retention-days: 14
          if-no-files-found: error
