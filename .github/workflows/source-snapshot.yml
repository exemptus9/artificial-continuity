name: Preserve source snapshots
on:
  push:
    branches: [main, 'work/**']
    paths: ['site/**', 'tests/**', 'tools/**', 'docs/**', '.github/workflows/source-snapshot.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: main
          path: baseline
          persist-credentials: false
      - name: Archive tracked public source only
        run: |
          mkdir snapshots
          git -C candidate archive --format=tar.gz HEAD > snapshots/continuity-candidate-source.tar.gz
          git -C baseline archive --format=tar.gz HEAD > snapshots/continuity-main-source.tar.gz
          git -C candidate rev-parse HEAD > snapshots/candidate-commit.txt
          git -C baseline rev-parse HEAD > snapshots/baseline-commit.txt
          cd snapshots
          sha256sum *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: continuity-pinned-source
          path: snapshots/
          retention-days: 7
          if-no-files-found: error
