name: Test and deploy Continuity
on:
  push:
    branches: [main, 'work/**']
    paths: ['site/**', 'tests/**', 'tools/**', '.github/workflows/pages.yml']
  pull_request:
    paths: ['site/**', 'tests/**', 'tools/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: continuity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the previous published source for the upgrade test
        uses: actions/checkout@v4
        with:
          ref: ea41a077e753f90fb78de8e2e406b5f5af05f052
          path: .release-baseline
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and data tests
        run: |
          for f in site/*.js; do node --check "$f"; done
          node --test tests/*.test.cjs > data-tests.log 2>&1 || { tail -n 120 data-tests.log; exit 1; }
          tail -n 12 data-tests.log
        shell: bash
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Context and release boundary tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Install pinned browser test tooling
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium > browser-install.log 2>&1 || { tail -n 100 browser-install.log; exit 1; }
      - name: Real browser and native IndexedDB tests
        run: |
          node tests/browser.cjs
          node tests/operations-browser.cjs
          node tests/portability-browser.cjs
          node tests/handoff-browser.cjs
          node tests/platform-browser.cjs
          node tests/exchange-browser.cjs
          node tests/workflow-browser.cjs
          node tests/review-layout-browser.cjs
          node tests/family-browser.cjs
          node tests/family-recovery-browser.cjs
          node tests/archive-browser.cjs
          node tests/release-browser.cjs
          CONTINUITY_BASELINE_SITE=.release-baseline/site node tests/update-browser.cjs
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: continuity-browser-evidence
          path: |
            test-artifacts
            data-tests.log
            browser-install.log
          retention-days: 7
          if-no-files-found: ignore
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload tested workspace
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published bytes
        env:
          LIVE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 tools/verify_live_release.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned live-browser test tooling
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify published workflow in a fresh browser
        env:
          CONTINUITY_LIVE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node tests/live-release-browser.cjs
      - name: Preserve live verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: continuity-live-release-evidence
          path: test-artifacts/
          retention-days: 7
          if-no-files-found: error
