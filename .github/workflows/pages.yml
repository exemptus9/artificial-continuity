name: Deploy Continuity Live Lab

on:
  push:
    branches: [main]
    paths: ['site/**', 'tests/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript and data tests
        run: |
          node --check site/app.js
          node --check site/core.js
          node --check site/demo.js
          node --test tests/core.test.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload live workspace
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
