name: Selective listening Android 36 acceptance
on:
  push:
    branches: [work/total-recall-selective-20261125]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_SERIAL: emulator-5554
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run retained native host suite, Continuity transfer suite and Mint tests
        run: |
          set -euo pipefail
          python3 -m pip install -r android/requirements-transfer.txt
          mkdir -p android/build
          curl -fsSL --max-time 60 https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o android/build/json.jar
          echo '3cf6cd6892e32e2b4c1c39e0f52f5248a2f5b37646fdfbb79a66b46b618414ed  android/build/json.jar' | sha256sum --check
          RECALL_JSON_JAR="$PWD/android/build/json.jar" bash android/tests/run-host-tests.sh 2>&1 | tee android/build/host-tests.log
          python3 -m unittest discover -s mint -p 'test_*.py'
      - name: Install Android 36 SDK and emulator
        run: |
          set -euo pipefail
          sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -1)
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" --install 'platforms;android-36' 'build-tools;36.0.0' platform-tools emulator 'system-images;android-36;default;x86_64'
          sudo chmod a+rw /dev/kvm
          printf 'no\n' | "$(dirname "$sdkmanager")/avdmanager" create avd --force -n recall-synthetic -k 'system-images;android-36;default;x86_64'
      - name: Start disposable Android emulator
        run: |
          set -euo pipefail
          mkdir -p device-tests/build/receipts
          "$ANDROID_HOME/platform-tools/adb" start-server
          nohup "$ANDROID_HOME/emulator/emulator" -avd recall-synthetic -port 5554 -accel on -gpu swiftshader -no-window -no-audio -no-boot-anim -no-snapshot -camera-back none -camera-front none > device-tests/build/receipts/emulator.log 2>&1 < /dev/null &
      - name: Build both packages with the same disposable CI key
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="$ANDROID_HOME" RECALL_KEYSTORE="$RUNNER_TEMP/recall-ci.p12"
          RECALL_KEY_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$RECALL_KEY_PASSWORD"
          export RECALL_KEY_PASSWORD RECALL_SIGNING_KIND=ephemeral-test
          keytool -genkeypair -noprompt -alias recall-test -keystore "$RECALL_KEYSTORE" -storetype PKCS12 -storepass:env RECALL_KEY_PASSWORD -keypass:env RECALL_KEY_PASSWORD -keyalg RSA -keysize 3072 -validity 30 -dname 'CN=Disposable Recall Device Test'
          bash android/build.sh
          bash device-tests/build.sh
          rm -f "$RECALL_KEYSTORE"
      - name: Exercise archive, restart, speech model and capture controls
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          adb="$ANDROID_HOME/platform-tools/adb"
          timeout 300 bash -c 'until [ "$("$1" shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = 1 ]; do sleep 3; done' _ "$adb"
          "$adb" shell input keyevent 82
          timeout 600 bash device-tests/run.sh "$PWD/android/build/TotalRecall-0.10.0.apk"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selective-listening-device-receipts
          path: |
            device-tests/build/receipts
            android/build/build-receipt.json
            android/build/host-tests.log
            android/build/signature.txt
            android/build/package.txt
          retention-days: 14
