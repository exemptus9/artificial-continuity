name: Selective listening Android 36 acceptance
on:
  push:
    branches: [work/total-recall-selective-20261125]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_SERIAL: emulator-5554
      ANDROID_AVD_HOME: ${{ github.workspace }}/device-tests/build/avds
      ANDROID_USER_HOME: ${{ github.workspace }}/device-tests/build/android-user
      ANDROID_EMULATOR_HOME: ${{ github.workspace }}/device-tests/build/android-user
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache checksum-verified Android build dependencies
        uses: actions/cache@v4
        with:
          path: |
            android/build/json.jar
            android/build/speech/download
            android/build/speech/zxing-core.jar
            android/assets/offline-speech
          key: recall-speech-${{ runner.os }}-${{ hashFiles('android/prepare-speech.py','android/tests/prepare-prosody.py') }}
      - name: Run retained native host suite, Continuity transfer suite and Mint tests
        id: host_suite
        continue-on-error: true
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python3 -m pip install -r android/requirements-transfer.txt -r mint/requirements-cloud.txt 'moto[s3]==5.1.18' playwright==1.56.0
          mkdir -p android/build
          python3 - <<'PYTESTJAR'
          from pathlib import Path
          from runpy import run_path
          deps = run_path("android/prepare-speech.py")
          deps["fetch"](Path("android/build/json.jar"), deps["MAVEN"]+"org/json/json/20240303/json-20240303.jar",
                        "3cf6cd6892e32e2b4c1c39e0f52f5248a2f5b37646fdfbb79a66b46b618414ed")
          PYTESTJAR
          RECALL_JSON_JAR="$PWD/android/build/json.jar" bash android/tests/run-host-tests.sh 2>&1 | tee android/build/host-tests.log
          bash device-tests/test-engine.sh
          python3 -c 'import boto3, moto, playwright'
          python3 -m unittest discover -v -s mint -p 'test_*.py' 2>&1 | tee android/build/mint-cloud-tests.log
      - name: Install Android 36 SDK and emulator
        run: |
          set -euo pipefail
          sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -1)
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" --install 'platforms;android-36' 'build-tools;36.0.0' platform-tools emulator 'system-images;android-36;default;x86_64'
          sudo chmod a+rw /dev/kvm
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME"
          printf 'no\n' | "$(dirname "$sdkmanager")/avdmanager" create avd --force -n recall-synthetic --path "$ANDROID_AVD_HOME/recall-synthetic.avd" -k 'system-images;android-36;default;x86_64'
          test -e "$ANDROID_AVD_HOME/recall-synthetic.avd/config.ini"
          printf 'avd.ini.encoding=UTF-8\npath=%s\ntarget=android-36\n' "$ANDROID_AVD_HOME/recall-synthetic.avd" >"$ANDROID_AVD_HOME/recall-synthetic.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx recall-synthetic
      - name: Start disposable Android emulator
        run: |
          set -euo pipefail
          mkdir -p device-tests/build/receipts
          "$ANDROID_HOME/platform-tools/adb" start-server
          nohup "$ANDROID_HOME/emulator/emulator" -avd recall-synthetic -port 5554 -accel on -gpu swiftshader -no-window -no-audio -no-boot-anim -no-snapshot -camera-back none -camera-front none > device-tests/build/receipts/emulator.log 2>&1 < /dev/null &
      - name: Build retained upgrade fixtures, current app and acceptance tools with the same disposable CI key
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="$ANDROID_HOME" RECALL_KEYSTORE="$RUNNER_TEMP/recall-ci.p12"
          RECALL_KEY_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$RECALL_KEY_PASSWORD"
          export RECALL_KEY_PASSWORD RECALL_SIGNING_KIND=ephemeral-test
          keytool -genkeypair -noprompt -alias recall-test -keystore "$RECALL_KEYSTORE" -storetype PKCS12 -storepass:env RECALL_KEY_PASSWORD -keypass:env RECALL_KEY_PASSWORD -keyalg RSA -keysize 3072 -validity 30 -dname 'CN=Disposable Recall Device Test'
          bash android/build.sh
          bash device-tests/build.sh
          build_prior() {
            local version=$1 revision=$2 prior="$RUNNER_TEMP/recall-$1"
            git fetch --no-tags --depth 1 origin "$revision"
            git worktree add --detach "$prior" "$revision"
            # The old build scripts independently revalidate the cached speech dependencies.
            mkdir -p "$prior/android/build" "$prior/android/assets/offline-speech"
            cp -a android/build/speech "$prior/android/build/"
            if [[ "$version" == 0.11.0 ]]; then
              cp android/assets/offline-speech/vosk-model-small-en-us-0.15.zip "$prior/android/assets/offline-speech/"
            else
              cp -a android/assets/offline-speech/. "$prior/android/assets/offline-speech/"
            fi
            bash "$prior/android/build.sh"
          }
          build_prior 0.11.0 1979e60b50c2aef5c88eb315d9ea1ea1cfd9d7b8
          build_prior 0.28.1 d84cf4d24f8ae22d130ae7f891c842ca2f36d8ec
          build_prior 0.29.0 d735d2489e1341dfb85d05eb8fd1f901a8e7d570
          rm -f "$RECALL_KEYSTORE"
      - name: Verify in-place upgrade and exercise current Android app
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          adb="$ANDROID_HOME/platform-tools/adb"
          timeout 300 bash -c 'until [ "$("$1" shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = 1 ]; do sleep 3; done' _ "$adb"
          "$adb" shell input keyevent 82
          current_apk="$(python3 -c 'import json; print("android/build/TotalRecall-"+json.load(open("android/build/build-receipt.json"))["version"]+".apk")')"
          timeout 240 bash device-tests/upgrade.sh "$RUNNER_TEMP/recall-0.11.0/android/build/TotalRecall-0.11.0.apk" "$PWD/$current_apk"
          # The first probe required a clean emulator and has verified and removed its synthetic fixture.
          "$adb" uninstall org.continuity.recall.test
          timeout 240 bash device-tests/upgrade.sh "$RUNNER_TEMP/recall-0.28.1/android/build/TotalRecall-0.28.1.apk" "$PWD/$current_apk" 30
          "$adb" uninstall org.continuity.recall.test
          timeout 240 bash device-tests/upgrade.sh "$RUNNER_TEMP/recall-0.29.0/android/build/TotalRecall-0.29.0.apk" "$PWD/$current_apk" 31
          timeout 900 bash device-tests/run.sh "$PWD/$current_apk"
      - name: Exercise codec, pinned transfer and browser against the packaged Mint app
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export RECALL_PACKAGE_OUT="$RUNNER_TEMP/recall-deb"
          mkdir -p "$RECALL_PACKAGE_OUT"
          deb="$RECALL_PACKAGE_OUT/total-recall-desk.deb"
          bash mint/build_deb.sh "$deb"
          test -s "$deb"
          dpkg-deb -x "$deb" "$RUNNER_TEMP/recall-installed"
          host_py=$(find "$RUNNER_TEMP/recall-installed" -name recall_desk.py -print -quit)
          test -f "$host_py"
          python3 device-tests/archive-roundtrip.py --desk "$host_py"
      - name: Report independent host suite failures
        if: always() && steps.host_suite.outcome == 'failure'
        run: exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selective-listening-device-receipts
          path: |
            device-tests/build/receipts
            android/build/build-receipt.json
            android/build/host-tests.log
            android/build/mint-cloud-tests.log
            android/build/signature.txt
            android/build/package.txt
          retention-days: 14
