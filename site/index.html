<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Continuity v0.9 Live Lab</title>
<style>
:root{color-scheme:dark;--bg:#0d0f12;--panel:#14171b;--panel2:#191d22;--line:#2a3038;--text:#eef1f4;--muted:#9ba5b1;--accent:#d4a85f;--good:#8dc49a;--warn:#e0b36d;--bad:#d47b7b;--blue:#82aee8;--violet:#b79bea}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,sans-serif}.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{padding:20px 14px;border-right:1px solid var(--line);background:#101216;position:sticky;top:0;height:100vh}.brand{font:500 24px Georgia,serif;margin:0}.kick{color:var(--accent);font:600 10px ui-monospace;letter-spacing:.12em;text-transform:uppercase;margin:2px 0 20px}.nav button{width:100%;text-align:left;padding:9px 10px;margin:2px 0;border:0;border-radius:8px;background:transparent;color:var(--muted);cursor:pointer}.nav button.active,.nav button:hover{background:var(--panel2);color:var(--text)}.sidefoot{position:absolute;left:14px;right:14px;bottom:18px}.sidefoot button{width:100%;margin-top:6px}main{padding:30px;max-width:1180px;width:100%;margin:auto}h1{font:400 34px Georgia,serif;margin:0 0 4px}h2,h3{margin-top:0}.sub,.muted,.small{color:var(--muted)}.small{font-size:12px}.banner{border:1px solid #49515d;background:#151b22;border-radius:10px;padding:10px 12px;margin:20px 0}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s9{grid-column:span 9}.s12{grid-column:span 12}.section{font-size:11px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.wrap{flex-wrap:wrap}.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 7px;font:600 10px ui-monospace;color:var(--muted)}.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}.blue{color:var(--blue)}.violet{color:var(--violet)}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:8px 11px;border-radius:8px;cursor:pointer}.btn:hover{border-color:#58616d}.btn.primary{background:var(--accent);border-color:var(--accent);color:#15110b;font-weight:700}.btn.danger{border-color:#6d3c3c;color:#f0b1b1}.health{display:grid;grid-template-columns:1fr auto;border-top:1px solid var(--line);padding:8px 0}.health:first-child{border-top:0}.quote{border-left:2px solid var(--accent);padding-left:12px;color:#dce1e7}.item{border:1px solid var(--line);border-radius:9px;padding:12px;background:#111419;margin:9px 0}.item:hover{border-color:#3b434d}.conflict{border-color:#553638}.value{white-space:pre-wrap;background:#0c0f13;border:1px solid var(--line);border-radius:8px;padding:9px;font:12px ui-monospace}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}select,textarea,input{width:100%;background:#0f1216;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px}textarea{min-height:92px;resize:vertical}.field{margin:10px 0}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}.stack>*+*{margin-top:9px}.notice{padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#101419}.rule.hard{border-left:3px solid var(--bad)}.rule.advisory{border-left:3px solid var(--blue)}.modalback{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}.modal{width:min(720px,100%);max-height:88vh;overflow:auto;background:#14171b;border:1px solid #424a55;border-radius:14px;padding:20px}.footer{margin-top:40px;padding-top:14px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}@media(max-width:800px){.app{grid-template-columns:1fr}.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}.nav{display:flex;overflow:auto}.nav button{width:auto;white-space:nowrap}.sidefoot{position:static;margin-top:12px;display:flex;gap:6px}.sidefoot button{margin:0}.s3,.s4,.s5,.s6,.s7,.s8,.s9,.s12{grid-column:span 12}.two,.three{grid-template-columns:1fr}main{padding:18px}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="brand">Continuity</div>
  <div class="kick">Artificial Continuity · v0.9 Live Lab</div>
  <div class="nav">
    <button data-v="now" class="active">Now</button>
    <button data-v="capture">Capture</button>
    <button data-v="continue">Continue</button>
    <button data-v="prospective">Prospective</button>
    <button data-v="lab">Sync Lab</button>
    <button data-v="intelligence">Intelligence</button>
    <button data-v="constitution">Constitution</button>
    <button data-v="timeline">Timeline</button>
    <button data-v="about">About</button>
  </div>
  <div class="sidefoot"><button id="exportBtn" class="btn">Export state</button><button id="resetBtn" class="btn danger">Reset lab</button></div>
</aside>
<main id="main"></main>
</div>
<div id="overlay"></div>
<script>
const KEY='continuity-live-lab/0.9';
const defaults=()=>({
  version:'0.9.0',view:'now',evidenceCount:2,
  threads:[
    {id:'ux',title:'UX / Product Ideas',state:'CONTINUE',objective:'Capture recurring UX failures and derive reusable design principles.',last:'Intent Integrity and Artificial Continuity converged into a broader thesis.',next:'Promote strongest principle into Personal RFC-001.',open:['Define first public RFC','Test capture workflow on three real products'],waiting:null},
    {id:'brand',title:'BRANDONMEANT',state:'CONTINUE',objective:'Complete the seven-act manuscript architecture.',last:'Reprise placement remains unresolved across the seven acts.',next:'Audit reprise placement across all seven acts.',open:['Final reprise count','Page architecture'],waiting:null},
    {id:'archive',title:'RhymeMosaic Archive',state:'BLOCKED',objective:'Preserve the archive without exposing private historical material.',last:'Public/admin privacy boundary defined; imported items still need review.',next:'Review uncertain imported artifacts.',open:['Retention policy'],waiting:'Privacy review'}
  ],
  captures:[
    {id:'cap-1',type:'friction',text:'Button moved underneath my finger as the interface updated.',context:'mobile UI',at:new Date(Date.now()-3600000).toISOString(),status:'UNPROCESSED'},
    {id:'cap-2',type:'idea',text:'Mark a read conversation as Continue Later rather than pretending read means finished.',context:'ChatGPT',at:new Date(Date.now()-7200000).toISOString(),status:'UNPROCESSED'}
  ],
  ideas:[{id:'idea-1',title:'Intent Integrity',principle:'Persistent human intent should outrank transient interface state.',evidence:['cap-1'],status:'DEVELOPING'}],
  prospective:[{id:'pm-1',title:'Revisit Intent Integrity RFC',condition:{type:'evidence_count',threshold:5},reason:'Deferred until enough independent UX examples exist.',status:'ARMED',firedAt:null}],
  rules:[
    {id:'r1',name:'Preservation',level:'HARD',text:'Never permanently delete original creative work without explicit destructive authorization.'},
    {id:'r2',name:'Uncertainty',level:'HARD',text:'Do not convert uncertain information into fact.'},
    {id:'r3',name:'Agency',level:'HARD',text:'Meaningful external actions require explicit authorization.'},
    {id:'r4',name:'Attention',level:'ADVISORY',text:'Interrupt only when information meaningfully affects an active intention.'},
    {id:'r5',name:'Provenance',level:'HARD',text:'Major state changes must retain reason and source history.'}
  ],
  events:[{id:crypto.randomUUID(),type:'KERNEL_INITIALIZED',reason:'v0.9 Live Lab state created.',at:new Date().toISOString()}],
  sync:{diverged:false,res:{uxState:'base',confidence:'base',next:'base'},adopted:null}
});
let S=load();
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return x&&x.version?x:defaults()}catch{return defaults()}}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function event(type,reason,detail={}){S.events.push({id:crypto.randomUUID(),type,reason,detail,at:new Date().toISOString()});save()}
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function esc(s=''){return String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}
function badge(t,c=''){return `<span class="badge ${c}">${esc(t)}</span>`}
function shell(title,sub,body){$('#main').innerHTML=`<h1>${title}</h1><div class="sub">${sub}</div><div class="banner"><b>Local-first Live Lab.</b> State persists only in this browser via localStorage. No account, server, or remote AI is required.</div>${body}<div class="footer">Continuity v0.9 · local-first test surface · intent is the primary object</div>`;$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===S.view))}
function health(){const open=S.threads.reduce((n,t)=>n+t.open.length,0);const waiting=S.threads.filter(t=>['WAITING','BLOCKED'].includes(t.state)).length;return `<div class="health"><span>Open loops</span><b>${open}</b></div><div class="health"><span>Waiting / blocked</span><b>${waiting}</b></div><div class="health"><span>Captured friction</span><b>${S.captures.length}</b></div><div class="health"><span>Evidence count</span><b>${S.evidenceCount}</b></div><div class="health"><span>Context debt</span><b class="good">low</b></div>`}
function now(){const cont=S.threads.filter(t=>['CONTINUE','PROCESSING'].includes(t.state));shell('Now','The state of your intentions.',`<div class="grid"><section class="card s8"><div class="section">Continue</div>${cont.map(threadCard).join('')||'<div class="muted">Nothing currently requires continuation.</div>'}</section><section class="card s4"><div class="section">Kernel health</div>${health()}</section><section class="card s6"><div class="section">Captured</div>${S.captures.filter(c=>c.status==='UNPROCESSED').slice(-3).reverse().map(c=>`<div class="item"><div class="row"><b>${esc(c.type)}</b>${badge(c.status,'warn')}</div><p>${esc(c.text)}</p><div class="small">${new Date(c.at).toLocaleString()} · ${esc(c.context||'no context')}</div></div>`).join('')||'<div class="muted">Inbox clear.</div>'}</section><section class="card s6"><div class="section">Prospective memory</div>${S.prospective.map(p=>`<div class="item"><div class="row"><b>${esc(p.title)}</b>${badge(p.status,p.status==='FIRED'?'good':'blue')}</div><p>${esc(p.reason)}</p><div class="small">Condition: ${p.condition.type} ≥ ${p.condition.threshold}</div></div>`).join('')}</section></div>`);bindThreadResume()}
function threadCard(t){return `<div class="item"><div class="row"><div><b>${esc(t.title)}</b><div class="small">${esc(t.objective)}</div></div>${badge(t.state,'blue')}</div><p>${esc(t.last)}</p><div class="small"><b>Next:</b> ${esc(t.next)}</div><div style="margin-top:9px"><button class="btn resume" data-id="${t.id}">Resume</button></div></div>`}
function bindThreadResume(){$$('.resume').forEach(b=>b.onclick=()=>resume(b.dataset.id))}
function resume(id){const t=S.threads.find(x=>x.id===id);if(!t)return;$('#overlay').innerHTML=`<div class="modalback"><div class="modal"><div class="row"><div><div class="section">Resumption brief</div><h2>Here's where you were.</h2></div><button id="closeModal" class="btn">Close</button></div><div class="item"><div class="section">Objective</div>${esc(t.objective)}</div><div class="item"><div class="section">Last meaningful position</div>${esc(t.last)}</div><div class="item"><div class="section">Open loops</div>${t.open.map(x=>`<div>• ${esc(x)}</div>`).join('')||'None'}</div><div class="item"><div class="section">Next useful action</div><b>${esc(t.next)}</b></div><div class="row wrap"><select id="stateSelect" style="max-width:260px">${['CONTINUE','PROCESSING','WAITING','BLOCKED','RESOLVED','REFERENCE','ARCHIVED'].map(s=>`<option ${s===t.state?'selected':''}>${s}</option>`).join('')}</select><button id="applyState" class="btn primary">Update state</button></div></div></div>`;$('#closeModal').onclick=()=>$('#overlay').innerHTML='';$('#applyState').onclick=()=>{const before=t.state;t.state=$('#stateSelect').value;event('THREAD_STATE_CHANGED',`${t.title}: ${before} → ${t.state}`,{threadId:t.id,before,after:t.state});$('#overlay').innerHTML='';render()}}
function capture(){shell('Capture','Capture now. Understand later.',`<div class="grid"><section class="card s5"><div class="section">New capture</div><div class="field"><label>Type</label><select id="ctype"><option>friction</option><option>idea</option><option>observation</option><option>question</option><option>note</option></select></div><div class="field"><label>Thought / observation</label><textarea id="ctext" placeholder="Drop the thought before it disappears."></textarea></div><div class="field"><label>Context</label><input id="ccontext" placeholder="App, site, situation, device…"></div><button id="captureAdd" class="btn primary">Capture</button></section><section class="card s7"><div class="row"><div class="section">Inbox</div>${badge(`${S.captures.filter(c=>c.status==='UNPROCESSED').length} unprocessed`,'warn')}</div><div id="captureList">${captureList()}</div></section></div>`);$('#captureAdd').onclick=()=>{const text=$('#ctext').value.trim();if(!text)return;const c={id:crypto.randomUUID(),type:$('#ctype').value,text,context:$('#ccontext').value.trim(),at:new Date().toISOString(),status:'UNPROCESSED'};S.captures.push(c);S.evidenceCount++;event('CAPTURE_CREATED',text,{captureId:c.id,type:c.type,context:c.context});checkProspective();capture()};bindCaptureActions()}
function captureList(){return [...S.captures].reverse().map(c=>`<div class="item"><div class="row"><div><b>${esc(c.type)}</b> ${badge(c.status,c.status==='UNPROCESSED'?'warn':'good')}</div><span class="small">${new Date(c.at).toLocaleString()}</span></div><p>${esc(c.text)}</p><div class="small">${esc(c.context||'no context')}</div>${c.status==='UNPROCESSED'?`<div style="margin-top:8px"><button class="btn develop" data-id="${c.id}">Develop into idea</button> <button class="btn archive" data-id="${c.id}">Archive</button></div>`:''}</div>`).join('')}
function bindCaptureActions(){$$('.develop').forEach(b=>b.onclick=()=>{const c=S.captures.find(x=>x.id===b.dataset.id);c.status='DEVELOPED';const idea={id:crypto.randomUUID(),title:c.text.slice(0,65),principle:'Needs abstraction.',evidence:[c.id],status:'SEED'};S.ideas.push(idea);event('IDEA_CREATED','Capture promoted into an idea.',{captureId:c.id,ideaId:idea.id});capture()});$$('.archive').forEach(b=>b.onclick=()=>{const c=S.captures.find(x=>x.id===b.dataset.id);c.status='ARCHIVED';event('CAPTURE_ARCHIVED','Capture archived without deletion.',{captureId:c.id});capture()})}
function continueView(){shell('Continue','Unread is about pixels. Continue is about unfinished cognition.',`<div class="grid"><section class="card s12"><div class="section">Intentions</div>${S.threads.map(t=>`<div class="item"><div class="row"><div><b>${esc(t.title)}</b><div class="small">${esc(t.objective)}</div></div>${badge(t.state,stateColor(t.state))}</div><p>${esc(t.last)}</p><div class="two"><div><div class="section">Next useful action</div>${esc(t.next)}</div><div><div class="section">Open loops</div>${t.open.length}</div></div><div style="margin-top:9px"><button class="btn resume" data-id="${t.id}">Resume</button></div></div>`).join('')}</section></div>`);bindThreadResume()}
function stateColor(s){return s==='RESOLVED'?'good':s==='BLOCKED'?'bad':s==='WAITING'?'warn':'blue'}
function prospective(){shell('Prospective Memory','Remember the future by relevance, not only by clock time.',`<div class="grid"><section class="card s7"><div class="section">Armed memories</div>${S.prospective.map(p=>`<div class="item"><div class="row"><b>${esc(p.title)}</b>${badge(p.status,p.status==='FIRED'?'good':'blue')}</div><p>${esc(p.reason)}</p><div class="small">Trigger: evidence_count ≥ ${p.condition.threshold} · current ${S.evidenceCount}</div>${p.status==='ARMED'?'<button id="simulateEvidence" class="btn" style="margin-top:8px">Simulate another evidence event</button>':''}</div>`).join('')}</section><section class="card s5"><div class="section">Concept</div><div class="quote">“Not now” should not mean “never.” Preserve why something was deferred and the condition that makes it relevant again.</div><p class="small">When a trigger fires, Continuity records the event and surfaces a proposal. It does not silently perform external action.</p></section></div>`);const b=$('#simulateEvidence');if(b)b.onclick=()=>{S.evidenceCount++;event('EVIDENCE_ACCUMULATED','Simulated one additional independent evidence item.',{count:S.evidenceCount});checkProspective();prospective()}}
function checkProspective(){for(const p of S.prospective){if(p.status==='ARMED'&&p.condition.type==='evidence_count'&&S.evidenceCount>=p.condition.threshold){p.status='FIRED';p.firedAt=new Date().toISOString();event('PROSPECTIVE_TRIGGER_FIRED',p.title,{prospectiveId:p.id,condition:p.condition});const ux=S.threads.find(t=>t.id==='ux');if(ux&&ux.state!=='CONTINUE'){const before=ux.state;ux.state='CONTINUE';event('THREAD_STATE_CHANGED',`Prospective memory resurfaced ${ux.title}: ${before} → CONTINUE`,{threadId:ux.id,before,after:'CONTINUE'})}}}save()}
const base={uxState:'PROCESSING',confidence:72,next:'Promote strongest principle into a Personal RFC.'};const laptop={uxState:'CONTINUE',confidence:84,next:'Review Intent Integrity cluster.'};const phone={uxState:'WAITING',confidence:58,next:'Collect broader user evidence before promoting.'};
function lab(){if(!S.sync.diverged){shell('Sync Lab','Human history deserves at least the courtesy Git gives source code.',`<div class="grid"><section class="card s8"><div class="section">Two-device experiment</div><h3>Fork one valid past into two valid futures.</h3><p class="muted">Laptop resumes UX work and becomes more confident. Phone pauses that work and becomes less confident. Both histories are legitimate. Neither gets to silently overwrite the other.</p><button id="fork" class="btn primary">Generate divergence</button></section><section class="card s4"><div class="section">Invariant</div><div class="health"><span>Common ancestor</span><b>required</b></div><div class="health"><span>Both tails</span><b>preserved</b></div><div class="health"><span>Conflicts</span><b>explicit</b></div><div class="health"><span>Last-write-wins</span><b class="bad">forbidden</b></div></section></div>`);$('#fork').onclick=()=>{S.sync.diverged=true;event('SYNC_DIVERGENCE_DETECTED','Laptop and Phone independently changed the same intention.');lab()};return}const fields=[['uxState','UX / Product Ideas · state'],['confidence','Intent-first assumption · confidence'],['next','UX / Product Ideas · next action']];const cards=fields.map(([k,l])=>`<div class="item conflict"><div class="row"><b>${l}</b>${badge('CONFLICT','bad')}</div><div class="two"><div><div class="section">Laptop</div><div class="value">${laptop[k]}${k==='confidence'?'%':''}</div></div><div><div class="section">Phone</div><div class="value">${phone[k]}${k==='confidence'?'%':''}</div></div></div><div class="small" style="margin-top:9px">Resolution</div><select data-r="${k}"><option value="base">Keep common ancestor (${base[k]}${k==='confidence'?'%':''})</option><option value="left">Take Laptop</option><option value="right">Take Phone</option></select></div>`).join('');shell('Sync Lab','Divergence is data. Reconciliation is a decision.',`<div class="grid"><section class="card s12"><div class="row"><div><div class="section">History analysis</div><h3>DIVERGED</h3></div>${badge('common ancestor preserved','warn')}</div><div class="three"><div class="card"><div class="small">Ancestor</div><b>GENESIS→shared-head</b></div><div class="card"><div class="small">Laptop tail</div><b>2 valid events</b></div><div class="card"><div class="small">Phone tail</div><b>2 valid events</b></div></div></section><section class="card s12"><div class="section">Conflicts requiring judgment</div>${cards}</section><section class="card s12"><div class="row wrap"><div><div class="section">Explicit merge</div><b>Nothing touches main until you adopt it.</b></div><div><button id="preview" class="btn">Preview</button> <button id="adopt" class="btn primary">Adopt reconciled state</button></div></div><div id="previewBox" class="quote" style="margin-top:12px">Unresolved fields keep the common ancestor value.</div></section></div>`);$$('[data-r]').forEach(x=>{x.value=S.sync.res[x.dataset.r];x.onchange=()=>{S.sync.res[x.dataset.r]=x.value;save()}});$('#preview').onclick=()=>{const m=mergeSync();$('#previewBox').innerHTML=`<b>Preview:</b><br>UX state → ${m.uxState}<br>confidence → ${m.confidence}%<br>next → ${esc(m.next)}`};$('#adopt').onclick=()=>{S.sync.adopted=mergeSync();const ux=S.threads.find(t=>t.id==='ux');ux.state=S.sync.adopted.uxState;ux.next=S.sync.adopted.next;event('STATE_RESTORED','User explicitly adopted three-way reconciliation.',S.sync.adopted);S.view='timeline';save();render()}}
function mergeSync(){const m={...base};for(const k of Object.keys(S.sync.res))m[k]=S.sync.res[k]==='left'?laptop[k]:S.sync.res[k]==='right'?phone[k]:base[k];return m}
function intelligence(){const pattern=S.ideas.length+S.captures.length>=3; shell('Intelligence','Reasoning retrieves continuity; it does not own it.',`<div class="grid"><section class="card s7"><div class="section">Context reconstruction</div><textarea id="q" placeholder="Try: that idea about an app moving under my finger"></textarea><button id="search" class="btn primary" style="margin-top:8px">Reconstruct context</button><div id="result" style="margin-top:12px"></div></section><section class="card s5"><div class="section">Provider boundary</div><div class="quote">Providers reason. The Kernel remembers, governs, synchronizes, and authorizes.</div><p class="small">This demo uses no remote provider and sends nothing anywhere.</p></section>${pattern?`<section class="card s12"><div class="row"><div><div class="section">Pattern Found</div><h3>Persistent user intent should outrank transient application state.</h3></div>${badge('cross-idea pattern','violet')}</div><p>Recent captures and Intent Integrity point to a broader principle: systems should preserve the user's ongoing intention across interface mutation, interruption, and resumption.</p></section>`:''}</div>`);$('#search').onclick=()=>{const q=$('#q').value.toLowerCase();const matches=[...S.captures,...S.ideas].filter(x=>JSON.stringify(x).toLowerCase().includes(q.split(/\s+/).filter(Boolean)[0]||'__none__'));$('#result').innerHTML=(matches.length?matches.slice(0,4).map(x=>`<div class="item"><b>${esc(x.title||x.type||'Capture')}</b><p>${esc(x.text||x.principle||'')}</p></div>`).join(''):`<div class="item"><div class="row"><b>UX-001 · Intent Integrity</b>${badge('semantic fallback','good')}</div><p>A target can move beneath the pointer/finger after the user has already committed to an action.</p><div class="small">Matched conceptually to interaction stability and temporal intent.</div></div>`)}}
function constitution(){shell('Personal Constitution','The AI can be powerful without being sovereign.',`<div class="grid"><section class="card s7"><div class="section">Rules</div>${S.rules.map(r=>`<div class="item rule ${r.level.toLowerCase()}"><div class="row"><b>${esc(r.name)}</b>${badge(r.level,r.level==='HARD'?'bad':'blue')}</div><p>${esc(r.text)}</p></div>`).join('')}</section><section class="card s5"><div class="section">Policy simulator</div><div class="field"><label>Proposed action</label><select id="action"><option value="rename">Rename an internal thread</option><option value="delete">Permanently delete original creative work</option><option value="email">Send an external email</option><option value="classify">Add an internal classification</option></select></div><button id="evaluate" class="btn primary">Evaluate against Constitution</button><div id="policyResult" style="margin-top:12px"></div></section></div>`);$('#evaluate').onclick=()=>{const a=$('#action').value;let result;if(a==='delete')result={status:'BLOCKED',why:'Preservation forbids permanent deletion without explicit destructive authorization.',c:'bad'};else if(a==='email')result={status:'APPROVAL REQUIRED',why:'Agency requires explicit authorization for meaningful external action.',c:'warn'};else result={status:'ALLOWED · REVERSIBLE',why:'Internal, reversible action may be performed and recorded in provenance.',c:'good'};$('#policyResult').innerHTML=`<div class="notice"><div>${badge(result.status,result.c)}</div><p>${esc(result.why)}</p></div>`;event('POLICY_EVALUATED',`${a}: ${result.status}`,{action:a,result:result.status})}}
function timeline(){shell('Timeline','State says what is true now. Events preserve how now became now.',`<div class="card">${[...S.events].reverse().map(e=>`<div class="item"><div class="row"><b>${esc(e.type)}</b><span class="small">${new Date(e.at).toLocaleString()}</span></div><p>${esc(e.reason)}</p>${e.detail&&Object.keys(e.detail).length?`<div class="value">${esc(JSON.stringify(e.detail,null,2))}</div>`:''}</div>`).join('')}</div>`)}
function about(){shell('Artificial Continuity','The product is continuity, not the current model.',`<div class="grid"><section class="card s8"><div class="quote">A transcript remembers what was said. Continuity remembers what it meant for what came next.</div><p>Artificial Continuity preserves the coherent evolution of intentions, decisions, assumptions, evidence, artifacts, and unresolved context through time.</p><p>AI extends reasoning. Artificial Continuity extends coherent becoming.</p></section><section class="card s4"><div class="section">Core doctrine</div><p>Intent over interface state.</p><p>Provenance over overwrite.</p><p>Uncertainty over false certainty.</p><p>Explicit authority over silent agency.</p><p>Divergence over data loss.</p><p>Portability over vendor custody.</p></section></div>`)}
function exportState(){const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`continuity-live-state-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href);event('STATE_EXPORTED','User exported the Live Lab state.')}
function resetLab(){if(!confirm('Reset this browser-only Live Lab state?'))return;localStorage.removeItem(KEY);S=defaults();save();render()}
function render(){save();if(S.view==='now')now();else if(S.view==='capture')capture();else if(S.view==='continue')continueView();else if(S.view==='prospective')prospective();else if(S.view==='lab')lab();else if(S.view==='intelligence')intelligence();else if(S.view==='constitution')constitution();else if(S.view==='timeline')timeline();else about()}
$$('.nav button').forEach(b=>b.onclick=()=>{S.view=b.dataset.v;save();render()});$('#exportBtn').onclick=exportState;$('#resetBtn').onclick=resetLab;checkProspective();render();
</script>
</body>
</html>
