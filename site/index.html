<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Continuity v0.8 Live Lab</title><style>
:root{color-scheme:dark;--bg:#0d0f12;--panel:#14171b;--panel2:#191d22;--line:#2a3038;--text:#eef1f4;--muted:#9ba5b1;--accent:#d4a85f;--good:#8dc49a;--warn:#e0b36d;--bad:#d47b7b;--blue:#82aee8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,sans-serif}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{padding:20px 14px;border-right:1px solid var(--line);background:#101216}.brand{font:500 24px Georgia,serif;margin:0}.kick{color:var(--accent);font:600 10px ui-monospace;letter-spacing:.12em;text-transform:uppercase;margin:2px 0 24px}.nav button{width:100%;text-align:left;padding:9px 10px;margin:2px 0;border:0;border-radius:8px;background:transparent;color:var(--muted);cursor:pointer}.nav button.active,.nav button:hover{background:var(--panel2);color:var(--text)}main{padding:30px;max-width:1180px;width:100%;margin:auto}h1{font:400 34px Georgia,serif;margin:0 0 4px}.sub,.muted,.small{color:var(--muted)}.small{font-size:12px}.banner{border:1px solid #49515d;background:#151b22;border-radius:10px;padding:10px 12px;margin:20px 0}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}.section{font-size:11px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}.row{display:flex;justify-content:space-between;gap:12px}.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 7px;font:600 10px ui-monospace;color:var(--muted)}.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}.blue{color:var(--blue)}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:8px 11px;border-radius:8px;cursor:pointer}.btn.primary{background:var(--accent);border-color:var(--accent);color:#15110b;font-weight:700}.health{display:grid;grid-template-columns:1fr auto;border-top:1px solid var(--line);padding:8px 0}.health:first-child{border-top:0}.quote{border-left:2px solid var(--accent);padding-left:12px;color:#dce1e7}.item{border:1px solid var(--line);border-radius:9px;padding:12px;background:#111419;margin:9px 0}.conflict{border-color:#553638}.value{white-space:pre-wrap;background:#0c0f13;border:1px solid var(--line);border-radius:8px;padding:9px;font:12px ui-monospace}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}select,textarea,input{width:100%;background:#0f1216;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px}.footer{margin-top:40px;padding-top:14px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}@media(max-width:800px){.app{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line)}.nav{display:flex;overflow:auto}.nav button{width:auto;white-space:nowrap}.s4,.s5,.s6,.s7,.s8,.s12{grid-column:span 12}.two{grid-template-columns:1fr}main{padding:18px}}
</style></head><body><div class="app"><aside class="side"><div class="brand">Continuity</div><div class="kick">Artificial Continuity · v0.8 Live Lab</div><div class="nav"><button data-v="now" class="active">Now</button><button data-v="lab">Sync Lab</button><button data-v="intelligence">Intelligence</button><button data-v="timeline">Timeline</button><button data-v="about">About</button></div></aside><main id="main"></main></div><script>
const S={view:'now',events:[{type:'KERNEL_INITIALIZED',reason:'Live Lab ephemeral state',at:new Date().toISOString()}],captures:2,adopted:null};
const base={uxState:'PROCESSING',confidence:72,next:'Promote strongest principle into a Personal RFC.'};
const laptop={uxState:'CONTINUE',confidence:84,next:'Review Intent Integrity cluster.'};
const phone={uxState:'WAITING',confidence:58,next:'Collect broader user evidence before promoting.'};
let diverged=false,res={uxState:'base',confidence:'base',next:'base'};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function badge(t,c=''){return `<span class="badge ${c}">${t}</span>`}function shell(title,sub,body){$('#main').innerHTML=`<h1>${title}</h1><div class="sub">${sub}</div><div class="banner"><b>Ephemeral Live Lab.</b> Nothing here is your canonical continuity; reload freely.</div>${body}<div class="footer">Continuity v0.8 · single-file test surface · no account/API/backend required</div>`;$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===S.view));}
function now(){shell('Now','The state of your intentions.',`<div class="grid"><section class="card s8"><div class="section">Continue</div><div class="item"><div class="row"><b>UX / Product Ideas</b>${badge(S.adopted?.uxState||base.uxState,'blue')}</div><p>Intent Integrity and Artificial Continuity are converging into a broader product thesis.</p><div class="small">Next: ${S.adopted?.next||base.next}</div></div><div class="item"><div class="row"><b>BRANDONMEANT</b>${badge('CONTINUE','blue')}</div><p>Seven-act manuscript architecture remains active.</p><div class="small">Next: audit reprise placement across all seven acts.</div></div></section><section class="card s4"><div class="section">Kernel health</div><div class="health"><span>Open loops</span><b>7</b></div><div class="health"><span>Context debt</span><b class="good">low</b></div><div class="health"><span>Captured friction</span><b>${S.captures}</b></div><div class="health"><span>Intent-first confidence</span><b>${S.adopted?.confidence||base.confidence}%</b></div></section><section class="card s12"><div class="section">Try the point of the product</div><div class="quote">Go to <b>Sync Lab</b>. Create two legitimate histories from the same past, let them disagree, then reconcile them without pretending one never happened.</div></section></div>`)}
function lab(){if(!diverged){shell('Sync Lab','Human history deserves at least the courtesy Git gives source code.',`<div class="grid"><section class="card s8"><div class="section">Two-device experiment</div><h3>Fork one valid past into two valid futures.</h3><p class="muted">Laptop resumes UX work and becomes more confident in intent-centered organization. Phone pauses that same work and becomes less confident. Both histories are legitimate. Neither gets to silently overwrite the other.</p><button id="fork" class="btn primary">Generate divergence</button></section><section class="card s4"><div class="section">Invariant</div><div class="health"><span>Common ancestor</span><b>required</b></div><div class="health"><span>Both tails</span><b>preserved</b></div><div class="health"><span>Conflicts</span><b>explicit</b></div><div class="health"><span>Last-write-wins</span><b class="bad">forbidden</b></div></section></div>`);$('#fork').onclick=()=>{diverged=true;S.events.push({type:'SYNC_DIVERGENCE_DETECTED',reason:'Laptop and Phone independently changed the same intention.',at:new Date().toISOString()});lab()};return}
const fields=[['uxState','UX / Product Ideas · state'],['confidence','Intent-first assumption · confidence'],['next','UX / Product Ideas · next action']];
const cards=fields.map(([k,l])=>`<div class="item conflict"><div class="row"><b>${l}</b>${badge('CONFLICT','bad')}</div><div class="two"><div><div class="section">Laptop</div><div class="value">${laptop[k]}${k==='confidence'?'%':''}</div></div><div><div class="section">Phone</div><div class="value">${phone[k]}${k==='confidence'?'%':''}</div></div></div><div class="small" style="margin-top:9px">Resolution</div><select data-r="${k}"><option value="base">Keep common ancestor (${base[k]}${k==='confidence'?'%':''})</option><option value="left">Take Laptop</option><option value="right">Take Phone</option></select></div>`).join('');
shell('Sync Lab','Divergence is data. Reconciliation is a decision.',`<div class="grid"><section class="card s12"><div class="row"><div><div class="section">History analysis</div><h3>DIVERGED</h3></div>${badge('common ancestor preserved','warn')}</div><div class="grid"><div class="card s4"><div class="small">Ancestor</div><b>GENESIS→shared-head</b></div><div class="card s4"><div class="small">Laptop tail</div><b>2 valid events</b></div><div class="card s4"><div class="small">Phone tail</div><b>2 valid events</b></div></div></section><section class="card s12"><div class="section">Conflicts requiring judgment</div>${cards}</section><section class="card s12"><div class="row"><div><div class="section">Explicit merge</div><b>Nothing touches main until you adopt it.</b></div><div><button id="preview" class="btn">Preview</button> <button id="adopt" class="btn primary">Adopt reconciled state</button></div></div><div id="previewBox" class="quote" style="margin-top:12px">Unresolved fields keep the common ancestor value.</div></section></div>`);$$('[data-r]').forEach(x=>{x.value=res[x.dataset.r];x.onchange=()=>res[x.dataset.r]=x.value});$('#preview').onclick=()=>{const m=merge();$('#previewBox').innerHTML=`<b>Preview:</b><br>UX state → ${m.uxState}<br>confidence → ${m.confidence}%<br>next → ${m.next}`};$('#adopt').onclick=()=>{S.adopted=merge();S.events.push({type:'STATE_RESTORED',reason:'User explicitly adopted three-way reconciliation.',at:new Date().toISOString()});S.view='timeline';render()}}
function merge(){const m={...base};for(const k of Object.keys(res))m[k]=res[k]==='left'?laptop[k]:res[k]==='right'?phone[k]:base[k];return m}
function intelligence(){shell('Intelligence','Reasoning retrieves continuity; it does not own it.',`<div class="grid"><section class="card s7"><div class="section">Context reconstruction</div><textarea id="q" placeholder="Try: that idea about an app moving under my finger"></textarea><button id="search" class="btn primary" style="margin-top:8px">Reconstruct context</button><div id="result" style="margin-top:12px"></div></section><section class="card s5"><div class="section">Provider boundary</div><div class="quote">Providers reason. The Kernel remembers, governs, synchronizes, and authorizes.</div><p class="small">This demo uses no remote provider and sends nothing anywhere.</p></section></div>`);$('#search').onclick=()=>{$('#result').innerHTML=`<div class="item"><div class="row"><b>UX-001 · Intent Integrity</b>${badge('0.94 match','good')}</div><p>A target can move beneath the pointer/finger after the user has already committed to an action.</p><div class="small">Matched cues: app · moving · finger · interaction stability</div></div><div class="item"><b>Higher-order principle</b><p>Persistent human intent should outrank transient interface state.</p></div>`}}
function timeline(){shell('Timeline','State says what is true now. Events preserve how now became now.',`<div class="card">${[...S.events].reverse().map(e=>`<div class="item"><b>${e.type}</b><div class="small">${e.at}</div><p>${e.reason}</p></div>`).join('')}</div>`)}
function about(){shell('Artificial Continuity','The product is continuity, not the current model.',`<div class="grid"><section class="card s8"><div class="quote">A transcript remembers what was said. Continuity remembers what it meant for what came next.</div><p>Artificial Continuity preserves the coherent evolution of intentions, decisions, assumptions, evidence, artifacts, and unresolved context through time.</p></section><section class="card s4"><div class="section">Core doctrine</div><p>Intent over interface state.</p><p>Provenance over overwrite.</p><p>Uncertainty over false certainty.</p><p>Explicit authority over silent agency.</p><p>Divergence over data loss.</p></section></div>`)}
function render(){if(S.view==='now')now();else if(S.view==='lab')lab();else if(S.view==='intelligence')intelligence();else if(S.view==='timeline')timeline();else about()}$$('.nav button').forEach(b=>b.onclick=()=>{S.view=b.dataset.v;render()});render();
</script></body></html>
